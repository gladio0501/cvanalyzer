[pytest]
# Test paths
testpaths = tests

# Markers
markers =
    unit: mark test as a unit test
    functional: mark test as a functional/integration test
    accuracy: mark test as an accuracy validation test
    performance: mark test as a performance test
    slow: mark test as slow running

# Default options
addopts = -v --tb=short

# Async mode
asyncio_mode = auto

# Coverage settings
[coverage:run]
source = .
omit = 
    tests/*
    venv/*
    */site-packages/*
    migrations/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
